[package]
name = "typst-wasm-component"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
comemo = "0.5"
serde_json = { version = "1.0.154", default-features = false }
typst = { version = "0.15.1", features = [], default-features = false }
typst-as-lib = { version = "0.18.0", default-features = false }
typst-layout = { version = "0.15.1", default-features = false }
typst-pdf = { version = "0.15.1", default-features = false, features = [] }
wit-bindgen = "0.63.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
