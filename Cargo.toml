[package]
name = "typst-wasm-component"
version = "0.1.0"
edition = "2024"

[dependencies]
comemo = "0.5"
serde_json = { version = "1.0.142", default-features = false }
typst = { version = "0.15.1", features = [], default-features = false }
typst-as-lib = { version = "0.17.0", default-features = false }
typst-layout = { version = "0.15.1", default-features = false }
typst-pdf = { version = "0.15.1", default-features = false, features = [] }
wit-bindgen = "0.63.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
